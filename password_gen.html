<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Password Generator</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fb;
      --surface: #ffffff;
      --surface-alt: #f1f5f9;
      --text: #172033;
      --muted: #637083;
      --border: #d8dee8;
      --accent: #1464d2;
      --accent-strong: #0f4aa2;
      --danger: #b42318;
      --success: #16734f;
      --shadow: 0 18px 45px rgba(20, 34, 55, 0.12);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        linear-gradient(135deg, rgba(20, 100, 210, 0.08), transparent 32%),
        linear-gradient(315deg, rgba(22, 115, 79, 0.08), transparent 34%),
        var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 32px 16px;
    }

    main {
      width: min(720px, 100%);
    }

    .tool {
      background: var(--surface);
      border: 1px solid rgba(216, 222, 232, 0.9);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: clamp(20px, 4vw, 34px);
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(1.55rem, 2.8vw, 2.2rem);
      line-height: 1.15;
      letter-spacing: 0;
    }

    .password-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: stretch;
      margin-bottom: 18px;
    }

    .password-box {
      min-height: 54px;
      display: flex;
      align-items: center;
      overflow-wrap: anywhere;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-alt);
      padding: 13px 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: clamp(1rem, 2.2vw, 1.32rem);
      line-height: 1.35;
    }

    .controls {
      display: grid;
      gap: 16px;
    }

    .count-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    label,
    .toggle {
      font-size: 0.92rem;
      color: var(--muted);
    }

    .field {
      display: grid;
      gap: 7px;
    }

    input[type="number"] {
      width: 100%;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 12px;
      color: var(--text);
      background: var(--surface);
      font: inherit;
    }

    input[type="number"]:focus,
    button:focus-visible,
    summary:focus-visible {
      outline: 3px solid rgba(20, 100, 210, 0.22);
      outline-offset: 2px;
    }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 46px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
    }

    .switch {
      position: relative;
      inline-size: 46px;
      block-size: 26px;
      flex: 0 0 auto;
    }

    .switch input {
      position: absolute;
      inset: 0;
      opacity: 0;
      inline-size: 100%;
      block-size: 100%;
      cursor: pointer;
    }

    .slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      border-radius: 999px;
      background: #a7b0be;
      transition: background 160ms ease;
    }

    .slider::before {
      content: "";
      position: absolute;
      inline-size: 20px;
      block-size: 20px;
      inset-block-start: 3px;
      inset-inline-start: 3px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 6px rgba(23, 32, 51, 0.2);
      transition: transform 160ms ease;
    }

    .switch input:checked + .slider {
      background: var(--accent);
    }

    .switch input:checked + .slider::before {
      transform: translateX(20px);
    }

    .switch input:focus-visible + .slider {
      outline: 3px solid rgba(20, 100, 210, 0.22);
      outline-offset: 2px;
    }

    .note {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.55;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      padding: 0 16px;
      color: #fff;
      background: var(--accent);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background 140ms ease, transform 140ms ease;
    }

    button:hover {
      background: var(--accent-strong);
    }

    button:active {
      transform: translateY(1px);
    }

    .copy-button {
      width: 74px;
      padding: 0 12px;
    }

    .status {
      min-height: 22px;
      color: var(--success);
      font-size: 0.92rem;
    }

    .status.error {
      color: var(--danger);
    }

    details {
      margin-top: 18px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    summary {
      cursor: pointer;
      color: var(--text);
      font-weight: 700;
      list-style-position: outside;
    }

    .history-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .history-empty {
      color: var(--muted);
      margin: 12px 0 0;
    }

    .history-item {
      display: grid;
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-alt);
      padding: 11px 12px;
    }

    .history-password {
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      color: var(--text);
    }

    .history-time {
      color: var(--muted);
      font-size: 0.84rem;
    }

    @media (max-width: 560px) {
      body {
        padding: 18px 12px;
      }

      .password-row,
      .count-grid {
        grid-template-columns: 1fr;
      }

      .copy-button {
        width: 100%;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="tool" aria-labelledby="title">
      <h1 id="title">随机密码</h1>

      <div class="password-row">
        <output id="passwordOutput" class="password-box" aria-live="polite"></output>
        <button id="copyButton" class="copy-button" type="button">复制</button>
      </div>

      <div class="controls">
        <label class="toggle" for="underscoreInput">
          <span>包含下划线</span>
          <span class="switch">
            <input id="underscoreInput" type="checkbox" checked>
            <span class="slider"></span>
          </span>
        </label>

        <div class="count-grid">
          <label class="field" for="upperInput">
            <span>大写</span>
            <input id="upperInput" type="number" min="0" max="64" value="4" inputmode="numeric">
          </label>
          <label class="field" for="lowerInput">
            <span>小写</span>
            <input id="lowerInput" type="number" min="0" max="64" value="4" inputmode="numeric">
          </label>
          <label class="field" for="digitInput">
            <span>数字</span>
            <input id="digitInput" type="number" min="0" max="64" value="4" inputmode="numeric">
          </label>
        </div>

        <p class="note">已排除易混字符：大写 I、小写 l、大写 O。</p>

        <div class="actions">
          <button id="generateButton" type="button">生成</button>
          <span id="status" class="status" role="status" aria-live="polite"></span>
        </div>
      </div>

      <details id="historyDetails">
        <summary>历史记录</summary>
        <div id="historyList" class="history-list"></div>
      </details>
    </section>
  </main>

  <script>
    (() => {
      const HISTORY_KEY = "passwordGenHistory.v1";
      const HISTORY_LIMIT = 20;
      const MAX_COUNT = 64;
      const POOLS = {
        upper: "ABCDEFGHJKLMNPQRSTUVWXYZ",
        lower: "abcdefghijkmnopqrstuvwxyz",
        digit: "0123456789"
      };

      const elements = {
        passwordOutput: document.querySelector("#passwordOutput"),
        copyButton: document.querySelector("#copyButton"),
        underscoreInput: document.querySelector("#underscoreInput"),
        upperInput: document.querySelector("#upperInput"),
        lowerInput: document.querySelector("#lowerInput"),
        digitInput: document.querySelector("#digitInput"),
        generateButton: document.querySelector("#generateButton"),
        status: document.querySelector("#status"),
        historyDetails: document.querySelector("#historyDetails"),
        historyList: document.querySelector("#historyList")
      };

      function randomInt(maxExclusive) {
        if (maxExclusive <= 0) {
          throw new Error("Invalid random range");
        }

        const maxUint = 0x100000000;
        const limit = maxUint - (maxUint % maxExclusive);
        const buffer = new Uint32Array(1);
        let value;

        do {
          crypto.getRandomValues(buffer);
          value = buffer[0];
        } while (value >= limit);

        return value % maxExclusive;
      }

      function clampCount(input) {
        const parsed = Number.parseInt(input.value, 10);
        const count = Number.isFinite(parsed) ? parsed : 0;
        const clamped = Math.min(MAX_COUNT, Math.max(0, count));
        input.value = String(clamped);
        return clamped;
      }

      function pickCharacters(pool, count) {
        const chars = [];
        for (let index = 0; index < count; index += 1) {
          chars.push(pool[randomInt(pool.length)]);
        }
        return chars;
      }

      function shuffle(chars) {
        for (let index = chars.length - 1; index > 0; index -= 1) {
          const swapIndex = randomInt(index + 1);
          [chars[index], chars[swapIndex]] = [chars[swapIndex], chars[index]];
        }
        return chars;
      }

      function readHistory() {
        try {
          const parsed = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
          return Array.isArray(parsed) ? parsed.slice(0, HISTORY_LIMIT) : [];
        } catch {
          return [];
        }
      }

      function writeHistory(records) {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(records.slice(0, HISTORY_LIMIT)));
      }

      function addHistory(password) {
        const nextHistory = [
          {
            password,
            createdAt: new Date().toISOString()
          },
          ...readHistory()
        ].slice(0, HISTORY_LIMIT);

        writeHistory(nextHistory);

        if (elements.historyDetails.open) {
          renderHistory();
        }
      }

      function setStatus(message, isError = false) {
        elements.status.textContent = message;
        elements.status.classList.toggle("error", isError);
      }

      function generatePassword() {
        const upperCount = clampCount(elements.upperInput);
        const lowerCount = clampCount(elements.lowerInput);
        const digitCount = clampCount(elements.digitInput);
        const includeUnderscore = elements.underscoreInput.checked;

        const chars = [
          ...pickCharacters(POOLS.upper, upperCount),
          ...pickCharacters(POOLS.lower, lowerCount),
          ...pickCharacters(POOLS.digit, digitCount)
        ];

        if (includeUnderscore) {
          chars.push("_");
        }

        if (chars.length === 0) {
          setStatus("至少选择一种字符。", true);
          return "";
        }

        const password = shuffle(chars).join("");
        elements.passwordOutput.textContent = password;
        addHistory(password);
        setStatus("已生成。");
        return password;
      }

      function formatTime(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return value;
        }
        return new Intl.DateTimeFormat("zh-CN", {
          dateStyle: "medium",
          timeStyle: "medium"
        }).format(date);
      }

      function renderHistory() {
        const history = readHistory();
        elements.historyList.replaceChildren();

        if (history.length === 0) {
          const empty = document.createElement("p");
          empty.className = "history-empty";
          empty.textContent = "暂无记录。";
          elements.historyList.append(empty);
          return;
        }

        for (const record of history) {
          const item = document.createElement("article");
          item.className = "history-item";

          const password = document.createElement("div");
          password.className = "history-password";
          password.textContent = String(record.password || "");

          const time = document.createElement("time");
          time.className = "history-time";
          time.dateTime = String(record.createdAt || "");
          time.textContent = formatTime(record.createdAt);

          item.append(password, time);
          elements.historyList.append(item);
        }
      }

      async function copyPassword() {
        const password = elements.passwordOutput.textContent.trim();
        if (!password) {
          setStatus("没有可复制的密码。", true);
          return;
        }

        try {
          await navigator.clipboard.writeText(password);
          setStatus("已复制。");
        } catch {
          const selection = window.getSelection();
          const range = document.createRange();
          range.selectNodeContents(elements.passwordOutput);
          selection.removeAllRanges();
          selection.addRange(range);
          setStatus("已选中。");
        }
      }

      elements.generateButton.addEventListener("click", generatePassword);
      elements.copyButton.addEventListener("click", copyPassword);
      elements.historyDetails.addEventListener("toggle", () => {
        if (elements.historyDetails.open) {
          renderHistory();
        }
      });

      generatePassword();
    })();
  </script>
</body>
</html>
